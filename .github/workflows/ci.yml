---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python 语法检查
        run: |
          python3 -m py_compile figma-cli && echo "✓ figma-cli syntax OK"

      - name: Shell 语法检查
        run: |
          bash -n install.sh && echo "✓ install.sh syntax OK"
          for f in examples/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" && echo "✓ $f syntax OK"
          done

      - name: install shellcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install shellcheck

      - name: run shellcheck
        run: |
          shellcheck install.sh examples/*.sh
